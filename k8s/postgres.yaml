apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: legion-td
data:
  POSTGRES_DB: legion_td
  POSTGRES_USER: legion
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: legion-td
type: Opaque
stringData:
  POSTGRES_PASSWORD: legion_td_dev_password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: legion-td
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: legion-td
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: legion-td
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
